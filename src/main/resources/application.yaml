spring:
  application:
    name: guestrequestservice
  datasource:
    url: jdbc:postgresql://localhost:5432/hotel_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 20
